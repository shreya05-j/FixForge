version: '3.8'

services:
  backend:
    build:
      context: ./fixforge
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_DRY_RUN=${GITHUB_DRY_RUN:-true}
      - DATABASE_URL=sqlite+aiosqlite:///./data/fixforge.db
      - CHROMA_PERSIST_DIR=./data/chroma
      - PORT=8000
    volumes:
      - backend_data:/app/data
      # Mount host docker socket to enable containerized sandbox testing
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
