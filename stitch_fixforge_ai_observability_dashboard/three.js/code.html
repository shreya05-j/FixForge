<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_12 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_12" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_12');
  const devicePixelRatio = window.devicePixelRatio || 1;
  <threejs-scene>
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Terminal Shell Box
const shellGeometry = new THREE.BoxGeometry(4, 2.5, 0.2);
const shellMaterial = new THREE.MeshPhongMaterial({ color: 0x111111, transparent: true, opacity: 0.9, shininess: 100 });
const shell = new THREE.Mesh(shellGeometry, shellMaterial);
scene.add(shell);

// Border for Terminal
const edges = new THREE.EdgesGeometry(shellGeometry);
const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x333333 }));
scene.add(line);

// Agent Nodes (7 Spheres)
const nodes = [];
const nodeGroup = new THREE.Group();
for (let i = 0; i < 7; i++) {
    const geo = new THREE.SphereGeometry(0.1, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const node = new THREE.Mesh(geo, mat);
    const angle = (i / 7) * Math.PI * 2;
    node.position.set(Math.cos(angle) * 1.5, Math.sin(angle) * 1.5, 0.5);
    nodes.push(node);
    nodeGroup.add(node);
}
scene.add(nodeGroup);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

camera.position.z = 5;

const animate = () => {
    requestAnimationFrame(animate);
    shell.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
    line.rotation.y = shell.rotation.y;
    nodeGroup.rotation.z += 0.005;
    
    // Pulsing effect for nodes
    nodes.forEach((node, i) => {
        const scale = 1 + Math.sin(Date.now() * 0.005 + i) * 0.2;
        node.scale.set(scale, scale, scale);
    });
    
    renderer.render(scene, camera);
};

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
</threejs-scene>
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_12 -->
</body>
</html>
